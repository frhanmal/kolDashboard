<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Management - KOL Agency</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='34' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#FFF9FA] text-slate-800 flex min-h-screen">
  <header id="mobile-top-header" class="lg:hidden fixed top-0 inset-x-0 h-14 bg-white/95 backdrop-blur-md border-b border-rose-100 px-3.5 flex items-center justify-between z-30 shadow-xs">
    <button type="button" id="btn-mobile-menu" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold border border-rose-200/70 transition">
      <i data-lucide="menu" class="w-4 h-4"></i>
      <span>Menu</span>
    </button>
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 bg-gradient-to-tr from-rose-500 to-pink-400 text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-xs">K</div>
      <span class="font-bold text-xs text-slate-800">KOL Agency</span>
    </div>
  </header>

  <aside class="w-64 bg-white border-r border-rose-100 flex flex-col justify-between fixed inset-y-0 left-0 -translate-x-full lg:translate-x-0 h-full z-40">
    <div>
      <div class="p-5 border-b border-rose-50 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-rose-500 to-pink-400 text-white rounded-xl flex items-center justify-center font-bold text-lg">K</div>
        <div><h2 class="font-bold text-sm text-slate-800">KOL Agency</h2><p class="text-[11px] text-rose-400">Management OS</p></div>
      </div>
      <nav id="sidebar-nav" class="p-3.5 space-y-1"></nav>
    </div>
    <div class="p-4 border-t border-rose-50 space-y-3 bg-rose-50/20">
      <div id="db-status" class="flex items-center gap-2 text-[11px] text-slate-500"></div>
      <div class="flex items-center justify-between">
        <div><p id="user-name" class="text-xs font-bold">-</p><span id="user-role-badge" class="text-[10px]">-</span></div>
        <button type="button" id="btn-logout" class="p-2 text-slate-400 hover:text-rose-600 rounded-xl"><i data-lucide="log-out" class="w-4 h-4"></i></button>
      </div>
    </div>
  </aside>

  <main class="lg:ml-64 flex-1 p-4 sm:p-6 lg:p-8 pt-16 lg:pt-8 min-w-0 w-full">
    <header class="mb-6">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Client Management</h1>
      <p class="text-xs text-slate-500 mt-0.5">Klik kartu Brand/Klien untuk melihat daftar campaign dan nama-nama KOL yang terlibat.</p>
    </header>
    <div id="client-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <div id="modal-client-detail" class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl border border-rose-100 overflow-hidden">
      <div class="p-5 border-b border-rose-100 flex items-center justify-between">
        <div>
          <h2 id="client-modal-title" class="text-base font-bold text-slate-800">Detail Klien</h2>
          <p id="client-modal-subtitle" class="text-xs text-slate-500 mt-0.5">-</p>
        </div>
        <button type="button" id="close-client-modal" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="client-modal-body" class="p-5 overflow-y-auto space-y-4 text-xs"></div>
    </div>
  </div>

  <script type="module">
    import { initPageLayout, subscribeDemoCollection, updateDemoItem, showToast } from "./js/auth.js";

    const user = initPageLayout("clients", ["owner", "kol_specialist"]);
    const isOwner = user?.role === "owner";
    const formatRp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");

    const CAMPAIGN_STATUS_OPTIONS = [
      "Planning",
      "Active",
      "2 - Unsent ke Client, Ongoing",
      "3 - Sent ke Client, Ongoing",
      "4 - Approved, Campaign Onprocess",
      "1 - On Hold Postponed",
      "5 - Complete, Payment Due",
      "Completed"
    ];

    let byBrandMap = {};
    let currentModalBrand = "";

    const modalEl = document.getElementById("modal-client-detail");
    const closeModal = () => {
      modalEl.classList.add("hidden");
      modalEl.classList.remove("flex");
    };
    document.getElementById("close-client-modal").addEventListener("click", closeModal);
    modalEl.addEventListener("click", (e) => {
      if (e.target.id === "modal-client-detail") closeModal();
    });

    function openClientModal(brandName) {
      const data = byBrandMap[brandName];
      if (!data) return;
      currentModalBrand = brandName;

      document.getElementById("client-modal-title").textContent = `Brand / Klien: ${data.brand}`;
      document.getElementById("client-modal-subtitle").textContent =
        `${data.campaigns.length} Campaign • ${data.totalKol} KOL Terlibat • Total Publish: ${formatRp(data.publish)}`;

      const bodyEl = document.getElementById("client-modal-body");
      bodyEl.innerHTML = data.campaigns.map(c => {
        const kolHtml = c.kols.length
          ? c.kols.map(k => {
              const margin = Number(k.publishTotal || 0) - Number(k.nettTotal || 0);
              return `
                <div class="p-2.5 rounded-xl bg-rose-50/40 border border-rose-100/80 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <p class="font-bold text-slate-800">${k.kolName}</p>
                    <p class="text-[11px] text-slate-500">@${k.ig || k.tiktok || "-"} • Status: <span class="font-semibold text-rose-600">${k.status || "-"}</span></p>
                  </div>
                  <div class="text-right">
                    <p class="font-bold text-slate-800">${formatRp(k.publishTotal)}</p>
                    ${isOwner ? `<p class="text-[10px] font-semibold text-emerald-600">Margin: ${formatRp(margin)}</p>` : ""}
                  </div>
                </div>
              `;
            }).join("")
          : `<p class="text-slate-400 italic py-2">Belum ada KOL di campaign ini.</p>`;

        const curSt = c.status || "Planning";
        const opts = CAMPAIGN_STATUS_OPTIONS.includes(curSt) ? CAMPAIGN_STATUS_OPTIONS : [curSt, ...CAMPAIGN_STATUS_OPTIONS];
        const selectOptsHtml = opts.map(st => `<option value="${st}" ${st === curSt ? "selected" : ""}>${st}</option>`).join("");

        return `
          <div class="p-4 rounded-2xl border border-rose-100 bg-white space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-rose-50 pb-2.5">
              <div>
                <p class="text-sm font-bold text-slate-800">${c.name}</p>
                <p class="text-[11px] text-slate-400">Niche: ${c.niche || "-"} • PIC: ${c.pic || "-"}</p>
              </div>
              <div class="flex items-center gap-1.5">
                <label class="text-[10px] font-bold uppercase text-slate-400">Status:</label>
                <select data-cmp-id="${c.id}" class="cli-cmp-status-select px-2.5 py-1 rounded-xl border border-rose-200 bg-rose-50/70 text-[11px] font-bold text-rose-700 outline-none focus:ring-2 focus:ring-rose-400 cursor-pointer">
                  ${selectOptsHtml}
                </select>
              </div>
            </div>
            <div class="space-y-1.5">
              <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Nama KOL (${c.kols.length})</p>
              ${kolHtml}
            </div>
          </div>
        `;
      }).join("");

      bodyEl.querySelectorAll(".cli-cmp-status-select").forEach(sel => {
        sel.addEventListener("change", (e) => {
          const cmpId = e.target.dataset.cmpId;
          const newStatus = e.target.value;
          updateDemoItem("campaigns", cmpId, {
            status: newStatus,
            updatedBy: user?.name || "Unknown",
            updatedAt: new Date().toISOString()
          });
          showToast(`Status campaign diubah ke "${newStatus}"!`);
        });
      });

      modalEl.classList.remove("hidden");
      modalEl.classList.add("flex");
      if (window.lucide) window.lucide.createIcons();
    }

    function render(cmps) {
      const byBrand = {};
      Object.values(cmps || {}).forEach(c => {
        const b = c.brand || c.client || "Umum";
        if (!byBrand[b]) {
          byBrand[b] = { brand: b, count: 0, totalKol: 0, publish: 0, margin: 0, campaigns: [] };
        }
        const itemsList = Object.values(c.items || {});
        byBrand[b].count++;
        byBrand[b].campaigns.push({ ...c, kols: itemsList });

        itemsList.forEach(i => {
          byBrand[b].totalKol++;
          byBrand[b].publish += Number(i.publishTotal || 0);
          byBrand[b].margin += Number(i.publishTotal || 0) - Number(i.nettTotal || 0);
        });
      });

      byBrandMap = byBrand;
      const list = Object.values(byBrand);
      const gridEl = document.getElementById("client-grid");

      gridEl.innerHTML = list.length
        ? list.map(b => `
            <div data-brand="${encodeURIComponent(b.brand)}" class="client-card cursor-pointer bg-white p-5 rounded-2xl border border-rose-100 hover:border-rose-300 hover:-translate-y-0.5 shadow-sm space-y-2 transition">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-base font-bold text-slate-800">${b.brand}</h3>
                <span class="text-[11px] font-semibold text-rose-500">Lihat KOL &rarr;</span>
              </div>
              <p class="text-xs text-slate-500">${b.count} Campaign • ${b.totalKol} KOL Terlibat</p>
              <div class="pt-2 border-t border-rose-50 text-xs">
                <p class="text-slate-500">Total Publish Value: <strong class="text-rose-600">${formatRp(b.publish)}</strong></p>
                ${isOwner ? `<p class="text-emerald-600 font-bold mt-0.5">Estimasi Margin (Owner): ${formatRp(b.margin)}</p>` : ""}
              </div>
            </div>`).join("")
        : `<p class="text-sm text-slate-400">Belum ada data klien.</p>`;

      gridEl.querySelectorAll(".client-card").forEach(card => {
        card.addEventListener("click", () => {
          openClientModal(decodeURIComponent(card.dataset.brand));
        });
      });
    }

    subscribeDemoCollection("campaigns", data => {
      render(data || {});
      if (!modalEl.classList.contains("hidden") && currentModalBrand && byBrandMap[currentModalBrand]) {
        openClientModal(currentModalBrand);
      }
    });
  </script>
</body>
</html>
