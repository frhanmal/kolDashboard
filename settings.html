<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User & Markup Settings - KOL Management</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='34' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#FFF9FA] text-slate-800 flex min-h-screen">

  <header id="mobile-top-header" class="lg:hidden fixed top-0 inset-x-0 h-14 bg-white/95 backdrop-blur-md border-b border-rose-100 px-3.5 flex items-center justify-between z-30 shadow-xs">
    <button type="button" id="btn-mobile-menu" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold border border-rose-200/70 transition">
      <i data-lucide="menu" class="w-4 h-4"></i>
      <span>Menu</span>
    </button>
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 bg-gradient-to-tr from-rose-500 to-pink-400 text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-xs">K</div>
      <span class="font-bold text-xs text-slate-800">KOL Agency</span>
    </div>
  </header>

  <aside class="w-64 bg-white border-r border-rose-100 flex flex-col justify-between fixed inset-y-0 left-0 -translate-x-full lg:translate-x-0 h-full shadow-sm shadow-rose-100/30 z-40">
    <div>
      <div class="p-5 border-b border-rose-50 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-rose-500 to-pink-400 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-rose-200">K</div>
        <div>
          <h2 class="font-bold text-sm text-slate-800 leading-tight">KOL Agency</h2>
          <p class="text-[11px] text-rose-400 font-medium">Management System</p>
        </div>
      </div>
      <nav id="sidebar-nav" class="p-3.5 space-y-1.5"></nav>
    </div>

    <div class="p-4 border-t border-rose-50 space-y-3 bg-rose-50/20">
      <div id="db-status" class="flex items-center gap-2 text-[11px] text-slate-500"></div>
      <div class="flex items-center justify-between">
        <div>
          <p id="user-name" class="text-xs font-bold text-slate-800">-</p>
          <span id="user-role-badge" class="text-[10px]">-</span>
        </div>
        <button type="button" id="btn-logout" title="Logout" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-100/60 rounded-xl transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </aside>

  <main class="lg:ml-64 flex-1 p-4 sm:p-6 lg:p-8 pt-16 lg:pt-8 min-w-0 w-full">
    <header class="mb-6">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">User & Markup Settings</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Halaman khusus Owner untuk mengelola akun tim dan aturan markup default.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-rose-100/80 shadow-sm h-fit">
        <h2 class="text-base font-bold text-slate-800 mb-4">Tambah Akun Tim</h2>
        <form id="form-add-user" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap *</label>
            <input type="text" id="u-name" required placeholder="Contoh: Aldwin"
              class="w-full px-3.5 py-2 rounded-xl border border-rose-200 text-sm focus:ring-2 focus:ring-rose-400 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Username Login *</label>
            <input type="text" id="u-username" required placeholder="tanpa spasi (misal: aldwin)"
              class="w-full px-3.5 py-2 rounded-xl border border-rose-200 text-sm focus:ring-2 focus:ring-rose-400 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Password *</label>
            <input type="text" id="u-password" required placeholder="Minimal 3 karakter"
              class="w-full px-3.5 py-2 rounded-xl border border-rose-200 text-sm focus:ring-2 focus:ring-rose-400 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Role Akses *</label>
            <select id="u-role" class="w-full px-3.5 py-2 rounded-xl border border-rose-200 text-sm bg-white">
              <option value="kol_specialist">KOL Specialist</option>
              <option value="finance">Finance</option>
              <option value="owner">Owner (Akses Penuh)</option>
            </select>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white text-xs font-semibold shadow-md shadow-rose-200 transition">
            Simpan Akun Baru
          </button>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white rounded-2xl border border-rose-100/80 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-rose-50 flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base font-bold text-slate-800">Daftar Akun Terdaftar</h2>
          <span class="text-xs text-slate-400">Password hanya terlihat oleh Owner</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
              <tr class="bg-rose-50/50 border-b border-rose-100 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                <th class="py-3 px-4">Nama</th>
                <th class="py-3 px-4">Username</th>
                <th class="py-3 px-4">Password</th>
                <th class="py-3 px-4">Role</th>
                <th class="py-3 px-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="users-table-body" class="divide-y divide-rose-50 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/settings.js"></script>
</body>
</html>
