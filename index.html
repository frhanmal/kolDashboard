<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - KOL Management Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='34' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-[#FFF9FA] to-pink-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-rose-100/60 border border-rose-100 p-6 sm:p-8">
    <div class="text-center mb-7">
      <div class="w-12 h-12 bg-gradient-to-tr from-rose-500 to-pink-400 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow-md shadow-rose-200">
        K
      </div>
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">KOL Agency Dashboard</h1>
      <p class="text-sm text-slate-500 mt-1">Masuk sesuai role kamu untuk melanjutkan</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" id="username" required placeholder="owner / kol / finance"
          class="w-full px-4 py-2.5 rounded-xl border border-rose-200/80 bg-rose-50/20 text-sm focus:bg-white focus:ring-2 focus:ring-rose-400 focus:border-rose-400 outline-none transition" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-xl border border-rose-200/80 bg-rose-50/20 text-sm focus:bg-white focus:ring-2 focus:ring-rose-400 focus:border-rose-400 outline-none transition" />
      </div>

      <div id="error-msg" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-3"></div>

      <button type="submit" id="btn-submit"
        class="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md shadow-rose-200 transition">
        Masuk ke Dashboard
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-rose-100 text-xs text-slate-500 space-y-1.5">
      <p class="font-semibold text-slate-600">Akun Demo Default (Password: <code class="bg-rose-50 text-rose-600 px-1.5 py-0.5 rounded-md font-semibold">123</code>):</p>
      <p>• <strong class="text-slate-700">owner</strong> — Akses Penuh (Nett Rate, Margin, Finance, Settings)</p>
      <p>• <strong class="text-slate-700">kol</strong> — Master KOL & Monitoring Campaign</p>
      <p>• <strong class="text-slate-700">finance</strong> — Antrean Payment & View Master KOL</p>
    </div>
  </div>

  <script type="module">
    import { loginUser, getCurrentUser } from "./js/auth.js";

    if (getCurrentUser({ allowAutoDemo: false })) {
      window.location.replace("dashboard.html");
    }

    const form = document.getElementById("login-form");
    const errEl = document.getElementById("error-msg");
    const btn = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Memverifikasi...";

      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      try {
        const res = await loginUser(u, p);
        if (res.success) {
          window.location.replace("dashboard.html");
        } else {
          errEl.textContent = res.message;
          errEl.classList.remove("hidden");
        }
      } catch (err) {
        errEl.textContent = "Gagal terhubung ke server: " + err.message;
        errEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk ke Dashboard";
      }
    });
  </script>
</body>
</html>
